# macOS packaging. Local builds are unsigned; see docs/RELEASE.md for signing + notarization.
appId: app.twinglass.mac
productName: Twinglass
copyright: Copyright © 2026
directories:
  output: dist
  buildResources: build
# Package the Electron that npm installed (same pinned version) instead of downloading it again,
# so a GitHub outage can't break a build.
electronDist: node_modules/electron/dist
files:
  - out/**
  - package.json
# The scrcpy server is pushed to the phone at runtime; ship it next to the app, outside the asar.
extraResources:
  - from: resources/scrcpy-server-v5.0.1
    to: scrcpy-server-v5.0.1
  # The phone app: Add phone serves it over Wi-Fi (QR download); Settings → Phone app installs it over adb.
  - from: companion/app/build/outputs/apk/release/app-release.apk
    to: mob-mirror-companion.apk
  # Its version (Gradle's output-metadata), so the Mac knows when a phone's app is older.
  - from: companion/app/build/outputs/apk/release/output-metadata.json
    to: mob-mirror-companion.json
  # The command line tool (Build view → Command line): runs recorded tests and audits from a terminal or CI.
  - from: resources/bin/twinglass
    to: bin/twinglass
asar: true
mac:
  category: public.app-category.utilities
  target:
    - target: dmg
      arch: [arm64] # Apple Silicon
  # "-" = ad-hoc signature over the whole bundle. Without it the bundle's signature is broken
  # (electron-builder modifies Electron's pre-signed files), and on other Macs macOS refuses to open
  # it ("damaged / can't be opened"). Ad-hoc still shows the unidentified-developer warning: open
  # with right-click → Open once. For real releases: a Developer ID certificate (CSC_LINK /
  # CSC_KEY_PASSWORD), hardenedRuntime: true, and notarization (docs/RELEASE.md).
  identity: '-'
  hardenedRuntime: false
  minimumSystemVersion: '13.0'
dmg:
  title: Twinglass
