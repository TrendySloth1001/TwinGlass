<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Twinglass · Your Android phone, on your Mac</title>
    <meta name="description" content="Mirror and control your Android phone from your Mac over USB, wireless debugging or plain Wi-Fi. Second screens, unlock with Touch ID, and an MCP server for coding agents. Free." />
    <link rel="icon" type="image/png" href="/icon.png" />
    <link rel="apple-touch-icon" href="/icon-large.png" />
    <meta property="og:title" content="Twinglass · Your Android phone, on your Mac" />
    <meta property="og:description" content="Mirror it, control it, open a second screen of it, and let coding agents test on it." />
    <meta property="og:image" content="/demo-poster.jpg" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#0a0a0c" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <script>
      // The visitor's theme choice, applied before the page draws (no flash). No choice = the system's.
      try {
        var t = localStorage.getItem('twinglass:theme')
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
