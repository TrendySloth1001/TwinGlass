<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8B6CFF"/>
      <stop offset="1" stop-color="#4A27D4"/>
    </linearGradient>
    <radialGradient id="glow" cx=".3" cy=".15" r=".8">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".28"/>
      <stop offset=".6" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".96"/>
      <stop offset="1" stop-color="#EDE8FF" stop-opacity=".9"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".9"/>
      <stop offset=".45" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="22" stdDeviation="26" flood-color="#1A0A66" flood-opacity=".38"/>
    </filter>
    <clipPath id="body"><rect x="100" y="100" width="824" height="824" rx="190"/></clipPath>
  </defs>
  <!-- macOS squircle on the 1024 grid -->
  <rect x="100" y="100" width="824" height="824" rx="190" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="190" fill="url(#glow)"/>
  <!-- Twin glass panes, the same size: the one behind is clear glass, the one in front frosted. -->
  <rect x="268" y="300" width="300" height="470" rx="76" fill="#FFFFFF" fill-opacity=".14" stroke="#FFFFFF" stroke-opacity=".62" stroke-width="12"/>
  <g filter="url(#sh)">
    <rect x="456" y="254" width="300" height="470" rx="76" fill="url(#front)"/>
  </g>
  <!-- Where the panes overlap, the back pane's edge shows through the front one. -->
  <clipPath id="frontClip"><rect x="456" y="254" width="300" height="470" rx="76"/></clipPath>
  <g clip-path="url(#frontClip)">
    <rect x="268" y="300" width="300" height="470" rx="76" fill="#7C5CFF" fill-opacity=".12" stroke="#7C5CFF" stroke-opacity=".35" stroke-width="10"/>
  </g>
  <rect x="456" y="254" width="300" height="470" rx="76" fill="url(#sheen)" fill-opacity=".5"/>
  <rect x="462" y="260" width="288" height="458" rx="70" fill="none" stroke="#FFFFFF" stroke-opacity=".9" stroke-width="3"/>
</svg>
