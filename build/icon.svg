<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8B6CFF"/>
      <stop offset="1" stop-color="#4A27D4"/>
    </linearGradient>
    <radialGradient id="glow" cx=".3" cy=".15" r=".8">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".26"/>
      <stop offset=".6" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".30"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity=".12"/>
    </linearGradient>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".95"/>
      <stop offset="1" stop-color="#D9D2FF" stop-opacity=".9"/>
    </linearGradient>
    <linearGradient id="phone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#ECE7FF"/>
    </linearGradient>
    <filter id="sh" x="-40%" y="-30%" width="180%" height="160%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#1A0A66" flood-opacity=".42"/>
    </filter>
  </defs>
  <!-- macOS squircle on the 1024 grid -->
  <rect x="100" y="100" width="824" height="824" rx="190" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="190" fill="url(#glow)"/>

  <g transform="translate(20 -30)">
  <!-- The Mac: a laptop with a notched screen of clear glass, and its base. -->
  <rect x="214" y="318" width="520" height="340" rx="30" fill="url(#screen)" stroke="#FFFFFF" stroke-opacity=".8" stroke-width="13"/>
  <path d="M434 318h80v14a12 12 0 0 1-12 12h-56a12 12 0 0 1-12-12z" fill="#FFFFFF" fill-opacity=".8"/>
  <path d="M168 666h612a10 10 0 0 1 10 10v6a26 26 0 0 1-26 26H184a26 26 0 0 1-26-26v-6a10 10 0 0 1 10-10z" fill="url(#base)"/>
  <rect x="424" y="666" width="100" height="12" rx="6" fill="#7C5CFF" fill-opacity=".35"/>

  <!-- The Android phone in front: frosted, with a punch-hole camera. -->
  <g filter="url(#sh)">
    <rect x="614" y="404" width="212" height="386" rx="42" fill="url(#phone)"/>
  </g>
  <rect x="620" y="410" width="200" height="374" rx="36" fill="none" stroke="#FFFFFF" stroke-width="3"/>
  <circle cx="720" cy="440" r="11" fill="#4A27D4" fill-opacity=".55"/>
  <rect x="680" y="756" width="80" height="8" rx="4" fill="#7C5CFF" fill-opacity=".4"/>
  </g>
</svg>
