<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5B6CFF"/><stop offset="1" stop-color="#7A2FF0"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".95"/><stop offset="1" stop-color="#E6E9FF" stop-opacity=".88"/></linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#1B0B5A" flood-opacity=".35"/></filter>
  </defs>
  <!-- macOS squircle on the 1024 grid (824 body) -->
  <rect x="100" y="100" width="824" height="824" rx="190" fill="url(#bg)"/>
  <!-- back pane: the Mac screen -->
  <rect x="250" y="300" width="380" height="430" rx="56" fill="#FFFFFF" fill-opacity=".18" stroke="#FFFFFF" stroke-opacity=".55" stroke-width="14"/>
  <!-- front pane: the phone -->
  <g filter="url(#sh)">
    <rect x="470" y="250" width="290" height="520" rx="64" fill="url(#glass)"/>
    <rect x="470" y="250" width="290" height="520" rx="64" fill="url(#shine)"/>
    <rect x="575" y="282" width="80" height="16" rx="8" fill="#7A2FF0" fill-opacity=".45"/>
  </g>
</svg>
