<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'" />
    <title>Mob Mirror</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <aside id="sidebar">
      <header>
        <h1>Mob Mirror</h1>
        <button id="refresh" title="Refresh devices">↻</button>
      </header>
      <ul id="devices"></ul>
      <p id="adb" class="muted"></p>
    </aside>

    <main id="mirror">
      <nav id="toolbar" hidden>
        <span id="device-name"></span>
        <div class="group">
          <button data-key="BACK" title="Back (right-click)">◁</button>
          <button data-key="HOME" title="Home (middle-click)">○</button>
          <button data-key="APP_SWITCH" title="Recents">▢</button>
        </div>
        <div class="group">
          <button data-key="VOLUME_DOWN" title="Volume down">🔉</button>
          <button data-key="VOLUME_UP" title="Volume up">🔊</button>
          <button data-key="POWER" title="Power">⏻</button>
        </div>
        <div class="group">
          <button data-action="notifications" title="Notification panel">⌄</button>
          <button data-action="rotate" title="Rotate device">⟳</button>
          <button data-action="screen-off" title="Turn the phone screen off (mirroring continues)">◐</button>
        </div>
        <button data-action="disconnect" class="danger" title="Disconnect">Disconnect</button>
      </nav>
      <div id="stage">
        <canvas id="screen" tabindex="0"></canvas>
        <div id="placeholder">Choose a device to start mirroring.</div>
      </div>
      <footer id="status" class="muted"></footer>
    </main>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
